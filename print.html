<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>دروس العربية للناطقين بغيرها — الإمام أحمد شيخ توري جميل</title>
<style>
  :root{
    --ink:#1e293b; --muted:#64748b; --brand:#15803d; --brand2:#16a34a;
    --gold:#b8860b; --gold2:#f4cd63; --line:#e2e8f0; --soft:#f0fdf4;
  }
  /*
    Each lesson occupies exactly THREE pages so the index page numbers are exact:
      page 1 = cover, page 2 = index, then lesson i (0-based) starts at 3 + i*3
      (1) dialogue  (2) vocabulary  (3) quiz
  */
  @page {
    size: A4;
    margin: 15mm 13mm 16mm 13mm;
    @bottom-center {
      content: counter(page);
      font-family: "Segoe UI", Tahoma, sans-serif;
      font-size: 9pt; color: #94a3b8;
    }
  }
  @page :first { @bottom-center { content: ""; } }

  * { box-sizing: border-box; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  html,body{ margin:0; padding:0; background:#fff; }
  body{
    direction: rtl;
    font-family: "Amiri", "Scheherazade New", "Traditional Arabic", "Sakkal Majalla", "Segoe UI", "Tahoma", serif;
    color: var(--ink); font-size: 12.5pt; line-height: 1.8;
  }
  .en{ direction: ltr; unicode-bidi: isolate; font-family: "Segoe UI", Tahoma, sans-serif; }
  h1,h2,h3,h4{ margin:0 0 .3em; }

  /* ---- Cover ---- */
  .cover{ text-align:center; padding-top: 11vh; page-break-after: always; break-after: page; }
  .cover .logo{
    width:108px;height:108px;border-radius:28px;margin:0 auto 22px;
    display:grid;place-items:center;
    background:linear-gradient(135deg,#15803d,#16a34a);
    color:#f4cd63; font-size:58px; font-weight:700;
    box-shadow: 0 14px 30px -12px rgba(21,128,61,.55);
  }
  .cover h1{ font-size: 35pt; color: var(--brand); }
  .cover h2{ font-size: 15pt; color: var(--gold); font-weight:700; margin-bottom: 22px; }
  .cover .rule{ width: 130px; height:4px; background: var(--gold); border-radius:4px; margin: 22px auto; }
  .cover .sub{ color: var(--muted); font-size: 12pt; margin: .25em 0; }
  .cover .author{ margin-top: 38px; font-size: 16pt; font-weight:700; color: var(--brand); }
  .cover .meta{ margin-top: 6px; color: var(--muted); font-size: 10.5pt; }

  /* ---- Index / Table of contents ---- */
  .toc{ page-break-after: always; break-after: page; }
  .toc h2{ color: var(--brand); font-size: 19pt; border-bottom: 2px solid var(--line); padding-bottom: 6px; }
  .toc .hint{ color: var(--muted); font-size: 9.5pt; margin: 0 0 12px; }
  .toc-item{ display:flex; align-items:baseline; gap:.45em; margin:.4em 0; }
  .toc-item .num{ color: var(--muted); font-size: 10.5pt; min-width: 1.9em; }
  .toc-item .ico{ font-size: 12pt; }
  .toc-item .ttl{ font-weight:700; }
  .toc-item .en{ color: var(--muted); font-size: 10pt; }
  .toc-item .lvl{ color: var(--gold); font-size: 9.5pt; }
  .toc-item .dots{ flex:1 1 auto; border-bottom: 1px dotted #cbd5e1; transform: translateY(-4px); min-width: 18px; }
  .toc-item .pg{ font-weight:700; color: var(--brand); min-width: 1.6em; text-align: end; }

  /* ---- Lesson ---- */
  .lesson{ page-break-before: always; break-before: page; }
  .lesson .break-page{ page-break-before: always; break-before: page; }
  .cont-head{
    display:flex; justify-content:space-between; gap:10px;
    font-size: 10.5pt; color: var(--muted);
    border-bottom: 1px solid var(--line); padding-bottom: 4px; margin-bottom: 10px;
  }
  .cont-head b{ color: var(--brand); font-weight:700; }
  .lesson-head{ border-bottom: 3px solid var(--brand); padding-bottom: 8px; margin-bottom: 12px; }
  .lesson-head .top{ display:flex; align-items:center; gap:12px; }
  .lesson-head .icon{ font-size: 24pt; }
  .lesson-head h2{ font-size: 21pt; color: var(--brand); margin:0; }
  .lesson-head .ent{ font-size: 12pt; color: var(--muted); font-weight:700; }
  .lesson-head .level{
    margin-inline-start:auto; background: var(--brand); color:#fff;
    border-radius: 999px; padding: 3px 14px; font-size: 10pt; white-space:nowrap;
  }
  .summary{ background: var(--soft); border:1px solid #bbf7d0; border-radius:10px; padding:8px 12px; margin-bottom: 12px; }
  .summary .en{ color: var(--muted); font-size: 10.5pt; }

  h3.sec{ color: var(--brand); font-size: 14pt; margin: 14px 0 4px; border-inline-start: 5px solid var(--gold); padding-inline-start: 10px; }

  table{ width:100%; border-collapse: collapse; margin: 8px 0 4px; }
  th,td{ border:1px solid var(--line); padding: 6px 8px; vertical-align: top; text-align: start; }
  thead th{ background: var(--brand); color:#fff; font-weight:700; }
  tr{ page-break-inside: avoid; }
  .sp{ white-space: nowrap; font-weight:700; color: var(--brand); width: 13%; }
  .tr{ color: var(--muted); font-size: 10pt; direction: ltr; unicode-bidi: isolate; }
  .ar2{ font-size: 13pt; }
  .en2{ direction: ltr; unicode-bidi: isolate; font-family:"Segoe UI",Tahoma,sans-serif; color:#334155; }

  .vocab .v-ar{ font-weight:700; width: 34%; }
  .vocab .v-tr{ color: var(--muted); font-size:10pt; direction:ltr; unicode-bidi:isolate; width:30%; }

  .quiz .q{ margin: 9px 0 2px; font-weight:700; }
  .quiz .q .en{ font-weight:400; color:#64748b; }
  .quiz ol{ padding-inline-start: 1.4em; margin: 2px 0 0; }
  .quiz li{ margin: .12em 0; }
  .quiz li.correct{ color: #067647; font-weight:700; }
  .quiz li.correct::after{ content: "  ✓"; }
</style>
</head>
<body>
<div id="doc"></div>

<script src="assets/js/lessons.js"></script>
<script>
(function(){
  var esc = function(s){ return String(s == null ? "" : s)
      .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); };

  var today = new Date().toLocaleDateString('ar-EG', {year:'numeric', month:'long', day:'numeric'});
  var TOTAL = LESSONS.length;
  var FIRST_LESSON_PAGE = 3;     /* cover = 1, index = 2 */
  var LESSON_PAGES = 3;          /* dialogue / vocabulary / quiz */
  var startPage = function(i){ return FIRST_LESSON_PAGE + i * LESSON_PAGES; };

  var html = '';

  /* Cover */
  html += ''
    + '<section class="cover">'
    +   '<div class="logo">أ</div>'
    +   '<h1>دروس العربية</h1>'
    +   '<h2>للناطقين بغيرها</h2>'
    +   '<div class="rule"></div>'
    +   '<p class="sub">محادثات ومواقف يومية مع ترجمة إنجليزية ونقل صوتي</p>'
    +   '<p class="sub en">Everyday conversations with English translation &amp; transliteration</p>'
    +   '<div class="author">الإمام أحمد شيخ توري جميل</div>'
    +   '<p class="meta en">Imam Ahmad Sheikh Touray Jameel</p>'
    +   '<p class="sub" style="margin-top:16px">من قرية بجغكندا في غامبيا · تخرّج في معهد الإمام مالك الإسلامي وجامعة الإحسان · طالب في الجامعة الإسلامية بالمدينة المنورة</p>'
    +   '<p class="sub en">From Baja Kunda, The Gambia · Al-Imam Malick Islamic Institute &amp; Al Ihsan University · Islamic University of Madinah</p>'
    +   '<p class="meta">' + esc(today) + ' · ' + TOTAL + ' درساً</p>'
    + '</section>';

  /* Index */
  html += '<section class="toc"><h2>الفهرس · Table of Contents</h2>';
  html += '<p class="hint">الرقم في آخر السطر يشير إلى صفحة بداية كل درس · The number refers to the start page of each lesson</p>';
  LESSONS.forEach(function(l, i){
    html += '<div class="toc-item">'
          +   '<span class="num">' + (i + 1) + '.</span>'
          +   '<span class="ico">' + esc(l.icon || '') + '</span>'
          +   '<span class="ttl">' + esc(l.title.ar) + '</span>'
          +   '<span class="en">' + esc(l.title.en) + '</span>'
          +   '<span class="lvl">(' + esc(l.level) + ')</span>'
          +   '<span class="dots"></span>'
          +   '<span class="pg">' + startPage(i) + '</span>'
          + '</div>';
  });
  html += '</section>';

  /* Lessons */
  LESSONS.forEach(function(l){
    var head = function(sec){
      return '<div class="cont-head"><span>دروس العربية للناطقين بغيرها</span>'
           + '<span><b>' + esc(l.title.ar) + '</b> · ' + sec + '</span></div>';
    };

    html += '<section class="lesson">';

    /* --- page 1: cover/head + summary + dialogue --- */
    html += head('الحوار');
    html += '<div class="lesson-head"><div class="top">'
          +   '<span class="icon">' + esc(l.icon || '') + '</span>'
          +   '<div><h2>' + esc(l.title.ar) + '</h2>'
          +   '<div class="ent en">' + esc(l.title.en) + '</div></div>'
          +   '<span class="level">' + esc(l.level) + '</span>'
          + '</div></div>';
    html += '<div class="summary"><div>' + esc(l.summary.ar) + '</div>'
          +   '<div class="en">' + esc(l.summary.en) + '</div></div>';

    html += '<h3 class="sec">الحوار · Dialogue</h3>';
    html += '<table><thead><tr>'
          +   '<th class="sp">المتحدث</th><th>العربية</th><th>النقل الصوتي</th><th>English</th>'
          + '</tr></thead><tbody>';
    (l.dialogue || []).forEach(function(d){
      var sp = d.sp || {};
      html += '<tr>'
            +   '<td class="sp">' + esc(sp.ar) + '<div class="en" style="font-weight:400;color:#64748b">' + esc(sp.en) + '</div></td>'
            +   '<td class="ar2">' + esc(d.ar) + '</td>'
            +   '<td class="tr">' + esc(d.tr) + '</td>'
            +   '<td class="en2">' + esc(d.en) + '</td>'
            + '</tr>';
    });
    html += '</tbody></table>';

    /* --- page 2: vocabulary --- */
    html += '<h3 class="sec break-page">المفردات · Vocabulary</h3>';
    html += '<table class="vocab"><thead><tr>'
          +   '<th class="v-ar">الكلمة</th><th>النقل الصوتي</th><th>English</th>'
          + '</tr></thead><tbody>';
    (l.vocab || []).forEach(function(v){
      html += '<tr><td class="v-ar ar2">' + esc(v.ar) + '</td>'
            +   '<td class="v-tr">' + esc(v.tr) + '</td>'
            +   '<td class="en2">' + esc(v.en) + '</td></tr>';
    });
    html += '</tbody></table>';

    /* --- page 3: quiz --- */
    html += '<h3 class="sec break-page">الاختبار · Quiz</h3><div class="quiz">';
    (l.quiz || []).forEach(function(q, qi){
      html += '<div class="q">' + (qi + 1) + '. ' + esc(q.q.ar)
            + ' <span class="en">' + esc(q.q.en) + '</span></div>';
      html += '<ol type="a">';
      (q.options || []).forEach(function(o, oi){
        var cls = (oi === q.answer) ? ' class="correct"' : '';
        var en = (o.en && o.en !== o.ar)
          ? ' <span class="en" style="color:#94a3b8">' + esc(o.en) + '</span>' : '';
        html += '<li' + cls + '>' + esc(o.ar) + en + '</li>';
      });
      html += '</ol>';
    });
    html += '</div>';

    html += '</section>';
  });

  document.getElementById('doc').innerHTML = html;
  document.title = 'دروس العربية للناطقين بغيرها — الإمام أحمد شيخ توري جميل';
})();
</script>
</body>
</html>
